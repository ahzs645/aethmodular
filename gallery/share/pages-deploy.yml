# Deploys the gallery to GitHub Pages. Installed into ahzs645/aethmodular-gallery as
# .github/workflows/deploy.yml by gallery/share/publish_pages.py (edit it here, not there).
#
# The site is built from the public source repo at a pushed commit, with the data from a
# release of this repo (gallery-data.tar.gz: gallery/app/public/data, machine paths scrubbed
# before upload). Nothing built is committed anywhere.
#
# Two ways to start it: workflow_dispatch with the two inputs (publish_pages.py), or a push to
# main that changes deploy-request.json ({"source_sha": "...", "data_tag": "..."}), for a client
# that can push but not dispatch workflows.
name: Deploy gallery
run-name: Deploy gallery · ${{ inputs.source_sha || 'deploy-request.json' }} · ${{ inputs.data_tag || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: ahzs645/aethmodular commit to build
        required: true
      data_tag:
        description: release of this repo holding gallery-data.tar.gz
        required: true
  push:
    branches: [main]
    paths: [deploy-request.json]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Request
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          path: request
          sparse-checkout: deploy-request.json
          sparse-checkout-cone-mode: false
      - name: Inputs
        id: req
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DATA_TAG: ${{ inputs.data_tag }}
        run: |
          if [ -f request/deploy-request.json ]; then
            SOURCE_SHA=$(jq -r .source_sha request/deploy-request.json)
            DATA_TAG=$(jq -r .data_tag request/deploy-request.json)
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full commit SHA"; exit 1; }
          [[ "$DATA_TAG" =~ ^data-[0-9a-f]+$ ]] || { echo "::error::data_tag must look like data-<hash>"; exit 1; }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "data_tag=$DATA_TAG" >> "$GITHUB_OUTPUT"
          rm -rf request
      - uses: actions/checkout@v4
        with:
          repository: ahzs645/aethmodular
          ref: ${{ steps.req.outputs.source_sha }}
          # the maps and number fields come from @pgmaps/geo-toolkit, the submodule gallery/packages/geo-toolkit
          sparse-checkout: |
            gallery/app
            gallery/packages
            gallery/data
            gallery/share
            gallery/review
            tests
            docs
            research/ftir_hips_chem/scripts
            research/ftir_hips_chem/workflows
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            gallery/app/package-lock.json
            gallery/packages/geo-toolkit/package-lock.json
      - name: Install
        working-directory: gallery/app
        # postinstall (scripts/ensure-toolkit.mjs) installs and builds the toolkit submodule
        run: npm ci --no-audit --no-fund
      - name: Data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        # the release is unpacked over the exports committed at source_sha: where both have a file the release wins
        # (it is the fuller, later snapshot), and a committed export newer than the release still reaches the site.
        # The private sections' data folders (sections.json "public": false) are then removed, as the archive omits them.
        run: |
          gh release download "${{ steps.req.outputs.data_tag }}" --repo "${{ github.repository }}" --pattern gallery-data.tar.gz --dir "$RUNNER_TEMP"
          mkdir -p gallery/app/public/data
          DATA_SHA=$(sha256sum "$RUNNER_TEMP/gallery-data.tar.gz" | cut -d ' ' -f 1)
          DATA_PREFIX="${{ steps.req.outputs.data_tag }}"
          DATA_PREFIX="${DATA_PREFIX#data-}"
          [[ "$DATA_SHA" == "$DATA_PREFIX"* ]] || { echo "::error::data snapshot hash does not match its release tag"; exit 1; }
          echo "GALLERY_DATA_SHA256=$DATA_SHA" >> "$GITHUB_ENV"
          tar -xzf "$RUNNER_TEMP/gallery-data.tar.gz" -C gallery/app/public/data
          for d in $(jq -r '.sections[] | select(.public == false) | .data[]?' gallery/app/src/sections/sections.json); do
            [[ "$d" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::odd data folder name $d"; exit 1; }
            rm -rf "gallery/app/public/data/$d"
          done
          du -sh gallery/app/public/data
      - name: Verify and apply accepted continuum source scores
        run: |
          [[ "$(git rev-parse HEAD)" == "${{ steps.req.outputs.source_sha }}" ]] || { echo '::error::checked-out source differs from publication request'; exit 1; }
          python3 gallery/share/continuum_publication.py apply \
            --data-root gallery/app/public/data \
            --archive "$RUNNER_TEMP/gallery-data.tar.gz" \
            --data-tag "${{ steps.req.outputs.data_tag }}" \
            --receipt "$RUNNER_TEMP/continuum-source-verification.json"
      - name: Source and public-data checks
        working-directory: gallery/app
        run: |
          npm run typecheck
          npm run test:source
          npm run test:data:public
      - name: Build
        working-directory: gallery/app
        env:
          VITE_HIDE_EXPLAIN: '1'
          # leaves out the sections gallery/app/src/sections/sections.json marks private
          VITE_PUBLIC_BUILD: '1'
        run: npm run build -- --base ./ --outDir "$RUNNER_TEMP/site" --emptyOutDir
      - name: Check
        run: |
          touch "$RUNNER_TEMP/site/.nojekyll"
          if grep -rIlE '/Users/|GoogleDrive-|gh[op]_[A-Za-z0-9]{20,}' "$RUNNER_TEMP/site"; then
            echo "::error::machine paths or tokens in the build"; exit 1
          fi
          du -sh "$RUNNER_TEMP/site"
      - name: Verify exact built continuum bytes
        run: |
          python3 gallery/share/continuum_publication.py verify-built \
            --data-root "$RUNNER_TEMP/site/data" \
            --receipt "$RUNNER_TEMP/continuum-source-verification.json"
          cp "$RUNNER_TEMP/continuum-source-verification.json" "$RUNNER_TEMP/site/data/_verification/continuum-source.json"
      - name: Record source and data verification
        env:
          SOURCE_SHA: ${{ steps.req.outputs.source_sha }}
          DATA_TAG: ${{ steps.req.outputs.data_tag }}
        run: |
          jq -n --arg source "$SOURCE_SHA" --arg data_tag "$DATA_TAG" --arg data_sha256 "$GALLERY_DATA_SHA256" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --slurpfile continuum "$RUNNER_TEMP/continuum-source-verification.json" \
            '{schema_version:2, source_sha:$source, data_tag:$data_tag, data_sha256:$data_sha256, workflow_run:$run, scope:"public gallery software, data integration and exact built continuum bytes", passed:["typecheck","node-source","node-data-public","production-build","machine-path-scan","accepted-continuum-built-bytes"], continuum_source:$continuum[0], not_established:["independent target EC accuracy","research-only data reconciliation","fresh-context link and export acceptance"]}' \
            > "$RUNNER_TEMP/site/verification-receipt.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
