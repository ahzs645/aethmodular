# Prebuilt fallback for environments without GitHub release-asset upload access.
# Installed in the gallery repo by publish_pages.py --branch.
name: Deploy prebuilt gallery
run-name: Deploy prebuilt gallery · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/**
      - build-info.json
      - .github/workflows/deploy-static.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare prebuilt site
        run: |
          test -f index.html
          test -f build-info.json
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude=.git --exclude=.github ./ "$RUNNER_TEMP/site/"
          touch "$RUNNER_TEMP/site/.nojekyll"
          if grep -rIlE '/Users/|GoogleDrive-|gh[op]_[A-Za-z0-9]{20,}' "$RUNNER_TEMP/site"; then
            echo "::error::machine paths or tokens in the build"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
