name: EPA PMF5 native runtime probe
on:
  pull_request:
    paths:
      - '.github/workflows/pmf-native-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official EPA installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'epa-pmf-probe'
          New-Item -ItemType Directory -Force $root | Out-Null
          $exe = Join-Path $root 'epa_pmf_5.0_setup.exe'
          Invoke-WebRequest -Uri 'https://www.epa.gov/sites/default/files/2015-03/epa_pmf_5.0_setup.exe' -OutFile $exe -TimeoutSec 90
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne '49E020D69E5B4656E4CD540508872C7FAE2BFA69A48D2EEF0B7ABDE7CBE8DEBE') { throw 'EPA installer checksum changed; review before execution' }
          $target = Join-Path $root 'admin'
          $log = Join-Path $root 'install.log'
          $args = '/s /a /v"/qn TARGETDIR=' + $target + ' /L*v ' + $log + '"'
          $p = Start-Process $exe -ArgumentList $args -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Output 'Administrative installation timed out' }
          Write-Output ('Installer exit: ' + $p.ExitCode)
          Get-ChildItem $root -Recurse -File | Select-Object FullName,Length | Format-Table -AutoSize
          if (Test-Path $log) { Get-Content $log -Tail 60 }
          $files = @(Get-ChildItem $root -Recurse -File | Where-Object { $_.Name -match 'me2|iniparams|moreparams|sealed|\.key$|\.ini$' })
          foreach ($f in $files) {
            Write-Output ('ENGINE FILE: ' + $f.FullName)
            Get-FileHash $f.FullName -Algorithm SHA256 | Format-List
            if ($f.Extension -eq '.ini' -and $f.Length -lt 100000) { Get-Content $f.FullName -TotalCount 120 }
          }
          Write-Output 'PROBE ONLY: no PMF numerical fit claimed.'
          $global:LASTEXITCODE = 0
