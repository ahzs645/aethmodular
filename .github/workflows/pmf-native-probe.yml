name: EPA PMF5 native runtime probe
on:
  pull_request:
    paths:
      - '.github/workflows/pmf-native-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Inspect official EPA installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'epa-pmf-probe'
          New-Item -ItemType Directory -Force $root | Out-Null
          $exe = Join-Path $root 'epa_pmf_5.0_setup.exe'
          $url = 'https://www.epa.gov/sites/default/files/2015-03/epa_pmf_5.0_setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -TimeoutSec 90
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          (Get-Item $exe).VersionInfo | Format-List *
          $bytes = [IO.File]::ReadAllBytes($exe)
          Write-Output ('Header: ' + [BitConverter]::ToString($bytes[0..63]))
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          [regex]::Matches($text, '[ -~]{10,160}') | ForEach-Object { $_.Value } | Where-Object { $_ -match 'Setup|Install|\.msi|\.cab|SFX|Wise|NSIS|7-zip' } | Select-Object -First 70
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Download is not a PE executable' }
          & 7z l $exe
          $global:LASTEXITCODE = 0
          Write-Output 'PROBE ONLY: installer identified; no PMF fit or native-engine validation claimed.'
