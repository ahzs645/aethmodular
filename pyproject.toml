[project]
name = "aethmodular"
version = "1.0.0"
description = "Research-first ETAD analysis toolkit for aethalometer and FTIR workflows."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "matplotlib>=3.4.0",
  "numpy>=1.21.0",
  "openpyxl>=3.0.0",
  "pandas>=1.3.0,<3.0",
  "pyarrow>=16.0.0",
  "psutil>=5.8.0",
  "pytz>=2024.1",
  "requests>=2.31.0",
  "scikit-learn>=1.0.0",
  "scipy>=1.7.0",
  "seaborn>=0.11.0",
  "statsmodels>=0.12.0",
  "tabulate>=0.9.0",
  "tqdm>=4.66.0",
  "xlrd>=2.0.0",
]

[project.optional-dependencies]
# cartopy needs system GEOS/PROJ libraries, so it is an opt-in extra rather than
# a core dependency. Only scripts/pipelines/spartan_extras.py uses it, and that
# script now skips its world-map step cleanly when the import fails.
geo = ["cartopy>=0.22.0"]

# Slide/report builders under research/ftir_hips_chem/workflows/. Opt-in because
# only the deck builders need them: `uv sync --extra decks`.
decks = [
  "python-pptx>=0.6.21",
  "pillow>=10.0.0",
]

# Local calibration_explorer Flask app. Kept opt-in because the production
# analysis package does not otherwise need a web server or the neutral-baseline
# and accelerated batch dependencies: `uv sync --extra explorer`.
explorer = [
  "flask>=3.1.0",
  "ikpls>=6.1.0; python_version >= '3.10'",
  "polars>=1.0.0",
  "pybaselines>=1.2.0",
]

[project.scripts]
aeth = "aethmodular_cli.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.12.0",
]
notebooks = [
  "geopandas>=1.0.0",
  "ipykernel>=6.29.0",
  # Imported directly (IPython.display) by ~24 research build scripts, so
  # declare it rather than relying on it arriving via ipykernel.
  "ipython>=8.0.0",
  "nbclient>=0.10.0",
  "nbformat>=5.10.0",
  # Required by spartan_ec_2026_06_16/06_tool_style_plots.ipynb, which recreates
  # the UC Davis FTIR Calibration tool's interactive plots. Same undeclared-import
  # class as the tqdm/requests gaps fixed on 2026-07-26.
  "plotly>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "aethmodular_cli"]

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
  "research",
  "logs",
  # Vendored third-party code is preserved for upstream diffability, not linted.
  "src/external/calibration.py",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501", "E722", "F401", "F541", "F841"]

[tool.ruff.lint.per-file-ignores]
# Vendored third-party code retains its upstream formatting and lint violations.
"src/external/calibration.py" = ["E401", "E701", "E711", "E712", "F811"]
"src/data/qc/pkl_cleaning.py" = ["E712", "F821"]
"tests/test_quality_analysis.py" = ["F841"]
